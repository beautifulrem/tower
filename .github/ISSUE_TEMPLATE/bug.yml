name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw. Screenshots help.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Diagnostics
      description: Help → Export Diagnostics… writes a zip with versions, the environment check, settings and recent traces (secrets redacted, no pairing token). Attach it here, or paste the relevant part of the goal's trace (Watch, W).
  - type: input
    attributes:
      label: Versions
      description: Tower version (About Tower), macOS version, `pi --version`.
    validations:
      required: true
