name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw. Screenshots help.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Goal trace
      description: For goal problems, the relevant part of the goal's trace (⋯ → 观察), with secrets removed.
  - type: input
    attributes:
      label: Versions
      description: Tower version (About Tower), macOS version, `pi --version`.
    validations:
      required: true
