name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS: the sandbox (Seatbelt) tests and the Tauri shell target it first.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check and build the interface
        run: |
          pnpm --dir apps/desktop check
          pnpm --dir apps/desktop test
          pnpm --dir apps/desktop build
          tools/bundle-budget.sh

      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The real_pi test drives the real Pi (with a scripted model) and is
      # skipped when Pi is missing; install the supported version so it runs.
      - name: Install Pi for the real-engine test
        # The registry has had brief outages; retry before failing the run.
        run: |
          for i in 1 2 3; do
            npm i -g @earendil-works/pi-coding-agent@1.4.0 && exit 0
            sleep 15
          done
          exit 1

      - name: Rust tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          cargo test --workspace
          # The TypeScript bindings are generated from the Rust types: they
          # must be committed as generated.
          git diff --exit-code -- apps/desktop/src/gen

      - name: Verification cost on a larger repository (2 000 files, budget 120 s)
        run: cargo test -p tower-supervisor --test perf_verify -- --ignored --nocapture

      - name: Interface end-to-end tests (WebKit, accessibility)
        run: |
          pnpm --dir apps/desktop exec playwright install webkit
          tools/e2e.sh

      - name: Keep the end-to-end evidence of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: apps/desktop/test-results
          retention-days: 7

      - name: Extension tests
        run: node --test extensions/tower-goal/policy.test.ts extensions/tower-goal/sandboxfs.test.ts
