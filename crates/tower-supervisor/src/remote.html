<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Tower</title>
<style>
  :root {
    --bg: #fbfaf9; --fg: #1d1b1a; --dim: #6f6b68; --line: rgba(0,0,0,.09); --field: #fff;
    --amber: oklch(.62 .14 75); --green: oklch(.55 .12 150); --red: oklch(.55 .17 28);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151413; --fg: #ecebea; --dim: #9a9693; --line: rgba(255,255,255,.1); --field: #1f1e1d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 -apple-system, "PingFang SC", system-ui, sans-serif;
         padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 18px; }
  header b { font-size: 17px; letter-spacing: -.01em; }
  header span { color: var(--dim); font-size: 13px; margin-left: auto; font-variant-numeric: tabular-nums; }
  h2 { font-size: 12px; font-weight: 500; color: var(--dim); margin: 22px 0 8px; letter-spacing: .02em; }
  .card { border-top: 1px solid var(--line); padding: 14px 0; }
  .card:first-of-type { border-top: 0; }
  .meta { color: var(--dim); font-size: 12px; margin-bottom: 4px; }
  .title { font-weight: 600; }
  .title::before { content: ""; display: inline-block; width: 7px; height: 7px; background: var(--amber); margin-right: 8px; vertical-align: 2px; }
  .body { color: var(--dim); margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  button { font: inherit; font-size: 14px; padding: 7px 12px; border-radius: 7px; border: 1px solid var(--line);
           background: var(--field); color: var(--fg); }
  button.danger { color: var(--red); }
  button:active { opacity: .7; }
  textarea { width: 100%; margin-top: 10px; font: inherit; padding: 8px; border-radius: 7px; border: 1px solid var(--line);
             background: var(--field); color: var(--fg); resize: vertical; min-height: 44px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .state { color: var(--dim); font-size: 12px; }
  .empty { color: var(--dim); padding: 8px 0; }
  .error { color: var(--red); padding: 12px 0; }
</style>
</head>
<body>
<header><b>Tower</b><span id="status"></span></header>
<main id="app"><p class="empty" id="hello"></p></main>
<script>
const T = {
  en: { needs: "Needs you", running: "Running", none: "Nothing needs you.", noRuns: "No goal is running.", send: "Send",
        pause: "Pause", confirm: "Press again to confirm", unpaired: "Open the link from Tower's Settings on this phone to pair it.",
        updated: "updated", offline: "Can't reach Tower" },
  zh: { needs: "需要你", running: "运行中", none: "没有需要你的事。", noRuns: "没有正在运行的目标。", send: "发送",
        pause: "暂停", confirm: "再按一次确认", unpaired: "在这台手机上打开 Tower 设置里的链接完成配对。",
        updated: "更新于", offline: "连不上 Tower" },
};
let lang = (navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en";
const t = (k) => T[lang][k];
// The token comes in the link's fragment, which browsers never send.
if (location.hash.length > 1) { sessionStorage.setItem("tower-token", location.hash.slice(1)); history.replaceState(null, "", "/"); }
const token = sessionStorage.getItem("tower-token");
const app = document.getElementById("app");
const status = document.getElementById("status");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const api = async (path, body) => {
  const r = await fetch(path, { method: body ? "POST" : "GET", headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.status);
  return data;
};
let armed = null;
async function answer(id, response, danger) {
  if (danger && armed !== id + response) { armed = id + response; render(last); return; }
  armed = null;
  try { await api("/api/answer", { inbox_id: id, response }); } catch (e) { alert(e.message); }
  load();
}
async function pause(goal) {
  try { await api("/api/pause", { goal }); } catch (e) { alert(e.message); }
  load();
}
let last = null;
function render(s) {
  if (!s) return;
  lang = s.lang.startsWith("zh") ? "zh" : "en";
  document.documentElement.lang = s.lang;
  const items = s.inbox.filter((i) => i.kind !== "review_ready");
  let h = `<h2>${t("needs")} · ${items.length}</h2>`;
  if (!items.length) h += `<p class="empty">${t("none")}</p>`;
  for (const i of items) {
    const opts = i.options.map((o, n) => {
      const danger = i.tones[n] === "destructive";
      const label = danger && armed === i.id + o ? t("confirm") : o;
      return `<button class="${danger ? "danger" : ""}" data-id="${esc(i.id)}" data-o="${esc(o)}" data-d="${danger}">${esc(label)}</button>`;
    }).join("");
    h += `<div class="card"><div class="meta">${esc(i.goal_id)} · ${esc(i.goal_title)}</div>
      <div class="title">${esc(i.title)}</div>${i.body ? `<div class="body">${esc(i.body)}</div>` : ""}
      ${opts ? `<div class="opts">${opts}</div>` : ""}
      ${i.allow_text ? `<textarea id="t-${esc(i.id)}" rows="2"></textarea><div class="opts"><button data-send="${esc(i.id)}">${t("send")}</button></div>` : ""}</div>`;
  }
  const running = s.goals.filter((g) => g.state === "running");
  h += `<h2>${t("running")} · ${running.length}</h2>`;
  if (!running.length) h += `<p class="empty">${t("noRuns")}</p>`;
  for (const g of running) {
    h += `<div class="row"><span class="name">${esc(g.title)}</span><span class="state">${esc(g.live_line?.detail ?? "")}</span>
      <button data-pause="${esc(g.id)}">${t("pause")}</button></div>`;
  }
  app.innerHTML = h;
  status.textContent = `${t("updated")} ${new Date().toLocaleTimeString(lang === "zh" ? "zh-CN" : "en", { hour: "2-digit", minute: "2-digit" })}`;
}
app.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.pause) return pause(b.dataset.pause);
  if (b.dataset.send) { const v = document.getElementById("t-" + b.dataset.send).value.trim(); if (v) answer(b.dataset.send, v, false); return; }
  answer(b.dataset.id, b.dataset.o, b.dataset.d === "true");
});
async function load() {
  if (!token) { app.innerHTML = `<p class="empty">${t("unpaired")}</p>`; return; }
  try { last = await api("/api/state"); render(last); }
  catch (e) { app.innerHTML = `<p class="error">${t("offline")}: ${esc(e.message)}</p>`; }
}
load();
setInterval(() => { if (!document.hidden && !document.activeElement?.matches("textarea")) load(); }, 5000);
</script>
</body>
</html>
