<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Tower</title>
<style>
  /*
   * Tower on a phone: the same quiet cockpit, one column. Three greys and no
   * more; colour only where a human is needed (the amber strip on a card) or
   * the verifier has spoken (the green seal). Same tokens as the desktop's
   * tokens.css, in oklch; the system font so nothing is fetched. Every
   * target is at least 44pt, as iOS asks.
   */
  :root {
    --bg: oklch(0.992 0.002 80); --bg-raised: oklch(1 0 0); --bg-inset: oklch(0.975 0.003 80);
    --bg-hover: oklch(0.955 0.004 80); --bg-selected: oklch(0.940 0.006 80);
    --border-subtle: oklch(0.20 0.01 70 / 0.08); --border: oklch(0.20 0.01 70 / 0.14); --border-strong: oklch(0.20 0.01 70 / 0.22);
    --text-1: oklch(0.230 0.006 70); --text-2: oklch(0.430 0.006 70); --text-3: oklch(0.530 0.006 70); --text-4: oklch(0.555 0.005 70);
    --st-attention: oklch(0.600 0.150 65); --attention-bg: oklch(0.962 0.034 85);
    --st-danger: oklch(0.540 0.190 25); --st-verified: oklch(0.550 0.130 155); --st-active: oklch(0.500 0.130 240);
    --focus: oklch(0.230 0.006 70 / 0.65);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: oklch(0.180 0.004 70); --bg-raised: oklch(0.215 0.005 70); --bg-inset: oklch(0.160 0.004 70);
      --bg-hover: oklch(0.235 0.005 70); --bg-selected: oklch(0.265 0.006 70);
      --border-subtle: oklch(1 0 0 / 0.06); --border: oklch(1 0 0 / 0.12); --border-strong: oklch(1 0 0 / 0.18);
      --text-1: oklch(0.945 0.003 70); --text-2: oklch(0.860 0.005 70); --text-3: oklch(0.720 0.006 70); --text-4: oklch(0.620 0.006 70);
      --st-attention: oklch(0.800 0.150 75); --attention-bg: oklch(0.225 0.030 75);
      --st-danger: oklch(0.750 0.150 25); --st-verified: oklch(0.770 0.130 155); --st-active: oklch(0.780 0.120 235);
      --focus: oklch(0.945 0.003 70 / 0.70);
    }
  }
  * { box-sizing: border-box; }
  p, pre, figure { margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text-1);
    font: 15px/22px -apple-system, "PingFang SC", system-ui, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; letter-spacing: -0.003em;
    padding: max(14px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
  }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, "PingFang SC", monospace; font-size: 13px; }
  button { font: inherit; color: inherit; cursor: default; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, textarea:focus-visible { outline: 1.5px solid var(--focus); outline-offset: 2px; }

  /* The wordmark: a ring with the verifier's check, the name tracked wide — the desktop's, at the same size. */
  header { display: flex; align-items: center; gap: 8px; min-height: 32px; margin-bottom: 14px; }
  .wordmark { display: inline-flex; align-items: center; gap: 8px; font-size: 10px; line-height: 12px; letter-spacing: 0.14em; font-weight: 500; color: var(--text-3); }
  .wordmark svg { display: block; }
  #status { margin-left: auto; font-size: 12px; color: var(--text-3); display: inline-flex; align-items: center; gap: 6px; text-align: right; }
  #status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-4); flex: 0 0 auto; }
  #status.stale { color: var(--text-1); }
  #status.off .dot { border-radius: 1px; background: var(--st-danger); }

  /* Scale titles, as on the board: the word in the wordmark's small tracked voice, a hairline, the count. CJK is never tracked wide. */
  h2 { display: flex; align-items: center; gap: 10px; margin: 24px 0 8px; font-size: 10px; line-height: 16px; font-weight: 500; color: var(--text-3); letter-spacing: 0.08em; text-transform: uppercase; }
  html[lang^="zh"] h2 { font-size: 11px; letter-spacing: 0.04em; text-transform: none; }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--border-subtle); }
  h2 .num { color: var(--text-2); order: 3; font-size: 12px; letter-spacing: 0; }
  .empty { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; color: var(--text-2); font-size: 14px; }
  .empty svg { flex: 0 0 auto; margin-top: 6px; color: var(--text-3); }
  /* The empty list is the list's own shape, waiting: two hollow rows — the draft ring and a bar where each reading will land — never pretend data. */
  .ghost { margin-top: 4px; pointer-events: none; }
  .ghost .row { min-height: 44px; }
  .ghost svg { color: var(--text-4); }
  .ghost .bar { display: block; height: 6px; border-radius: 3px; background: var(--bg-selected); }
  .ghost .bar + .bar { margin-top: 8px; }
  .error { display: flex; align-items: center; gap: 10px; color: var(--text-1); font-size: 14px; padding: 10px 0; }
  .error::before { content: ""; display: inline-block; width: 8px; height: 8px; background: var(--st-danger); flex: 0 0 auto; }
  .error .btn { margin-left: auto; }

  /* A decision card: amber lives only in its 32px strip — the tint, and a 2px rule on its left edge, the desk's focused card in miniature. */
  .card { border: 1px solid var(--border); border-radius: 6px; background: var(--bg-raised); margin-bottom: 12px; overflow: hidden; }
  .strip { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px 0 10px; border-left: 2px solid var(--st-attention); background: var(--attention-bg); font-size: 12px; color: var(--text-2); white-space: nowrap; }
  .strip .mark { width: 9px; height: 9px; flex: 0 0 auto; }
  .strip .kind { color: var(--text-1); font-weight: 500; }
  .strip .goal { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .strip .age { margin-left: auto; color: var(--text-3); flex: 0 0 auto; }
  /* The bell: 44pt of target around a 12px glyph, quiet until pressed. */
  .strip .bell { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin: 0 -14px 0 -4px; padding: 0; border: 0; background: transparent; color: var(--text-3); opacity: .7; flex: 0 0 auto; }
  .strip .bell[aria-expanded="true"], .strip .bell:active { opacity: 1; color: var(--text-1); }
  /* "Later": two times, offered inline where the bell is; no sheet to dismiss. */
  .later { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px; color: var(--text-3); }
  .later .btn { min-height: 40px; font-size: 14px; }
  .main { padding: 10px 12px 12px; display: grid; gap: 8px; }
  .question { font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: -0.008em; user-select: text; }
  .question.code, .tail { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .question.code { font-size: 15px; font-weight: 500; word-break: break-word; }
  .body { color: var(--text-2); font-size: 14px; white-space: pre-wrap; word-break: break-word; user-select: text; }
  .tail { margin: 0; padding: 8px 10px; border-radius: 6px; background: var(--bg-inset); border: 1px solid var(--border-subtle); font-size: 12px; line-height: 18px; color: var(--text-2); white-space: pre-wrap; word-break: break-word; max-height: 160px; overflow: auto; }
  .caution { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; line-height: 16px; color: var(--text-1); }
  .caution svg { flex: 0 0 auto; margin-top: 3px; }
  .caution.note { color: var(--text-3); }
  /* Held-out output: your register — a solid 2px rule in text-1, like a human stamp, with "for you only" where a source would
     hang; the one block on a card the agent has never seen. The failing tests' names are machine values above the runner's lines. */
  .heldout { display: grid; gap: 8px; padding: 2px 0 2px 10px; border-left: 2px solid var(--text-1); }
  .heldout .label { font-size: 10px; line-height: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-2); font-weight: 500; }
  .heldout .head { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
  .heldout .head .id { color: var(--text-3); font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
  /* Each name in its own hairline chip, as on the desk: two names never read as one sentence, and a full line wraps a whole name. */
  .heldout .names { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 12px; color: var(--text-3); }
  .heldout .names code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; line-height: 20px; padding: 0 6px; border: 1px solid var(--border); border-radius: 4px; color: var(--text-1); user-select: text; }
  .heldout .tail { margin: 0; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-raised); color: var(--text-1); font-size: 15px; font-weight: 500; white-space: nowrap; }
  .btn:active { background: var(--bg-selected); }
  .btn.primary { background: var(--text-1); border-color: var(--text-1); color: var(--bg); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
  .btn.armed { border-color: var(--text-1); background: var(--bg-selected); }
  .btn:disabled { color: var(--text-3); border-color: var(--border-subtle); }
  /* Decisions that widen what the agent may do stay at the desk: named, not offered. */
  .desk { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; font-size: 12px; line-height: 16px; color: var(--text-3); }
  .desk b { font-weight: 500; color: var(--text-2); }
  textarea { width: 100%; font: inherit; font-size: 15px; line-height: 20px; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text-1); resize: none; min-height: 44px; outline: none; }
  textarea::placeholder { color: var(--text-3); }
  /* A field's focus is its edge, and the edge changes for real: text-3, a line the eye finds. */
  textarea:focus { border-color: var(--text-3); }
  textarea:focus-visible { outline: none; box-shadow: inset 0 0 0 1px var(--text-3); }
  .reply { display: flex; gap: 8px; align-items: flex-end; }
  .reply textarea { flex: 1; }
  /* The hint on a held-out card is the primary path: the field takes the whole line, the button the next. */
  .reply.hint { flex-wrap: wrap; }
  .reply.hint textarea { flex: 1 1 100%; }
  .reply.hint .btn { flex: 1 1 auto; }
  .claim { display: grid; grid-template-columns: 6.5em minmax(0, 1fr); column-gap: 10px; font-size: 14px; }
  .claim .who { font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-top: 3px; }
  .claim .who::before { content: "┆ "; color: var(--text-4); }
  .claim .what { color: var(--text-2); }

  /* A goal row: glyph, title, badge word · detail; the right column is an action or nothing. */
  .row { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; column-gap: 10px; align-items: center; min-height: 52px; padding: 6px 0; border-top: 1px solid var(--border-subtle); }
  .row:first-of-type { border-top: 0; }
  .row .glyph { display: block; }
  .row .title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .live { display: flex; gap: 6px; align-items: baseline; min-width: 0; font-size: 12px; line-height: 16px; color: var(--text-2); }
  .row .live .badge { color: var(--text-1); font-weight: 500; flex: 0 0 auto; }
  .row .live .detail { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .live .detail.code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; }
  .row .live .id { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; color: var(--text-3); flex: 0 0 auto; }
  .row .live .sep { color: var(--text-4); flex: 0 0 auto; }
  /* How long the run has been going: the desk's reading, in the desk's units, one register down. */
  .row .live .elapsed { color: var(--text-3); flex: 0 0 auto; }
  .row .seal { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-1); font-weight: 500; flex: 0 0 auto; }
  .row .seal .pin { color: var(--text-2); font-weight: 400; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; }
  .row .btn { min-height: 40px; padding: 0 14px; font-size: 14px; }
  .foot { margin-top: 28px; font-size: 11px; line-height: 16px; color: var(--text-4); text-align: center; }
</style>
</head>
<body>
<header>
  <span class="wordmark" aria-hidden="true">
    <svg width="14" height="14" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="butt" stroke-linejoin="miter"><circle cx="5" cy="5" r="4"/><path d="M3.1 5.2 L4.5 6.6 L7 3.7"/></svg>
    TOWER
  </span>
  <span id="status" role="status"><span class="dot"></span><span id="status-text"></span></span>
</header>
<main id="app"></main>
<p class="foot" id="foot"></p>
<script>
const T = {
  en: { needs: "Needs you", toAccept: "Ready to accept", running: "Running", none: "Nothing needs you.", noneBody: "Questions, approvals and pauses show up here.",
        noRuns: "No goal is running.", send: "Send", pause: "Pause", confirm: "Press again", unpaired: "Open the pairing link from Tower's Settings on this phone.",
        updated: "updated", every: "every 5 s", offline: "Can't reach Tower", retry: "Retry", you: "you", atDesk: "At your Mac",
        later: "Remind me later", inHour: "In 1 hour", tomorrow: "Tomorrow 9:00", putAside: "Put aside until",
        ago: (m) => m < 1 ? "just now" : m < 60 ? `${m} min ago` : `${Math.round(m / 60)} h ago`,
        runningFor: (d) => `running ${d}`,
        answerPlaceholder: "Write your answer…", notePlaceholder: "A note for the agent (optional)…",
        forYou: "For you only", failing: "failing", hintPlaceholder: "A hint for the agent, in your words…", sendHint: "Send the hint and resume",
        heldOutNote: "The agent does not know these tests exist. A hint, or only the names of what failed, keeps it that way; showing it the failure does not.",
        acceptOnDesk: "Review and accept on your Mac", claim: "Agent says", security: "A security decision: once approved, the verification setup reaches the network once, inside the sandbox.",
        foot: "Tower serves this page from your own computer. Only what needs you is here; the review stays at your Mac.",
        states: { draft: "Draft", ready: "Ready", running: "Running", paused: "Paused", claimed: "Claimed done", verifying: "Verifying", in_review: "Ready to accept", accepted: "Accepted", integrated: "Merged", archived: "Archived", abandoned: "Abandoned" },
        modes: { idle: "Idle", starting: "Starting", thinking: "Thinking", reading: "Working", editing: "Working", executing: "Working", waiting_on_you: "Needs you", retrying: "Retrying", compacting: "Compacting", verifying: "Verifying", settled: "Stopped" },
        kinds: { question: "Question", approval: "Approval", assumption: "Assumption", paused: "Paused", review_ready: "Ready to accept", stalled: "May be stuck", ci_failed: "CI failed" } },
  zh: { needs: "需要你", toAccept: "待验收", running: "运行中", none: "没有需要你决定的事。", noneBody: "问题、审批、假设与暂停会出现在这里。",
        noRuns: "没有正在运行的目标。", send: "发送", pause: "暂停", confirm: "再按一次", unpaired: "在这台手机上打开 Tower 设置里的配对链接。",
        updated: "更新于", every: "每 5 秒", offline: "连不上 Tower", retry: "重试", you: "你", atDesk: "在电脑上",
        later: "稍后提醒", inHour: "1 小时后", tomorrow: "明天 9:00", putAside: "已收起，再提醒于",
        ago: (m) => m < 1 ? "刚刚" : m < 60 ? `${m} 分钟前` : `${Math.round(m / 60)} 小时前`,
        runningFor: (d) => `已运行 ${d}`,
        answerPlaceholder: "写下你的回答…", notePlaceholder: "写给 Agent 的话（可选）…",
        forYou: "只给你看", failing: "失败", hintPlaceholder: "用你的话给 Agent 一句提示…", sendHint: "发送提示并继续",
        heldOutNote: "Agent 不知道这些测试存在。给它提示，或只告诉它哪些测试失败，都能保住这一点；把失败给它看则不能。",
        acceptOnDesk: "回到电脑上评审并验收", claim: "Agent 称", security: "这是一个安全决定：批准后，验证的准备命令会在沙箱里联网一次。",
        foot: "这个页面由你电脑上的 Tower 提供。这里只有需要你的事；评审留在电脑上。",
        states: { draft: "草稿", ready: "就绪", running: "运行中", paused: "已暂停", claimed: "自称完成", verifying: "验证中", in_review: "待验收", accepted: "已验收", integrated: "已合入", archived: "已归档", abandoned: "已放弃" },
        modes: { idle: "空闲", starting: "准备中", thinking: "思考", reading: "执行", editing: "执行", executing: "执行", waiting_on_you: "等你", retrying: "重试", compacting: "压缩中", verifying: "验证", settled: "已停" },
        kinds: { question: "问题", approval: "审批", assumption: "假设", paused: "已暂停", review_ready: "待验收", stalled: "可能卡住", ci_failed: "CI 失败" } },
};
let lang = (navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en";
const t = (k) => T[lang][k];
// The token comes in the link's fragment, which browsers never send.
if (location.hash.length > 1) { localStorage.setItem("tower-token", location.hash.slice(1)); history.replaceState(null, "", "/"); }
const token = localStorage.getItem("tower-token");
const app = document.getElementById("app");
const status = document.getElementById("status");
const statusText = document.getElementById("status-text");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const api = async (path, body) => {
  const r = await fetch(path, { method: body ? "POST" : "GET", headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.status);
  return data;
};
// Glyphs: the desktop's one-pen set, 10px grid, 1.25px butt-capped lines.
const G = {
  bell: `<svg width="12" height="12" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true"><path d="M2 7.5 L2 5 A3 3 0 0 1 8 5 L8 7.5 Z"/><path d="M4 8.8 A1 1 0 0 0 6 8.8"/></svg>`,
  diamond: `<svg class="mark" width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 0.6 L9.4 5 L5 9.4 L0.6 5 Z" fill="var(--st-attention)"/></svg>`,
  notice: `<svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1 L9 5 L5 9 L1 5 Z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>`,
  ring: `<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="4" fill="none" stroke="currentColor" stroke-width="1.25"/></svg>`,
  seal: `<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="4.25" fill="var(--st-verified)"/><path d="M3.1 5.2 L4.5 6.6 L7 3.7" fill="none" stroke="var(--bg)" stroke-width="1.25"/></svg>`,
  state(s) {
    const c = s === "running" || s === "verifying" ? "var(--st-active)" : s === "in_review" || s === "accepted" ? "var(--st-verified)" : "var(--text-3)";
    const ring = `<circle cx="5" cy="5" r="4" fill="none" stroke="${c}" stroke-width="1.25"${s === "claimed" || s === "verifying" ? ' stroke-dasharray="1.7 1.45"' : ""}/>`;
    const inner = s === "running" || s === "verifying" ? `<path d="M5 1 A4 4 0 0 0 5 9 Z" fill="${c}"/>`
      : s === "paused" ? `<line x1="3.3" y1="1.5" x2="3.3" y2="8.5" stroke="${c}" stroke-width="1.25"/><line x1="6.7" y1="1.5" x2="6.7" y2="8.5" stroke="${c}" stroke-width="1.25"/>`
      : s === "in_review" ? `<path d="M3.1 5.2 L4.5 6.6 L7 3.7" fill="none" stroke="${c}" stroke-width="1.25"/>`
      : s === "ready" ? `<circle cx="5" cy="5" r="1.2" fill="${c}"/>` : "";
    return `<svg class="glyph" width="10" height="10" viewBox="0 0 10 10" aria-label="${esc(t("states")[s] ?? s)}" role="img">${s === "paused" ? "" : ring}${inner}</svg>`;
  },
};
const machine = (s) => /^[\x20-\x7e]+$/.test(s) && !/\s{2,}/.test(s);
// Where rows will be: the row grid itself, each with a hollow ring and two bars (title, live line) of the given widths.
const ghost = (rows) => `<div class="ghost" aria-hidden="true">${rows.map(([a, b]) => `<div class="row">${G.ring}<div><i class="bar" style="width:${a}%"></i><i class="bar" style="width:${b}%"></i></div><span></span></div>`).join("")}</div>`;
// Prose first, machine lines (an installer's tail, a command, a path) after, as on the desk.
const MACHINE = /^(npm |pnpm |yarn |cargo |pip |error|Error|ERR!|\s{2,}at |[\w./-]+\.(json|lock|toml|yaml|yml|js|ts|rs|py)$|[$>] |\S+@\d)/;
function parts(i) {
  const body = (i.body || "").trim();
  if (!body || body === i.subject.trim()) return { prose: "", tail: "" };
  if (i.kind === "approval") return { prose: "", tail: body };
  const lines = body.split("\n");
  const first = lines.findIndex((l) => MACHINE.test(l.trim()));
  if (first < 0) return { prose: body, tail: "" };
  return { prose: lines.slice(0, first).join("\n").trim(), tail: lines.slice(first).join("\n").trim() };
}
// A held-out card's body, as the desk reads it: the supervisor's sentence; a line per criterion naming its failing tests
// ("Failing in C2: a, b" / "C2 失败的测试：a、b"); then one block per failed criterion, `C2 · title` over the runner's lines.
// The output is for you alone, so it never goes through the prose/tail split above.
const HELD_HEAD = /^(\S{1,12}) · (.+)$/;
const HELD_NAMES = /^(?:Failing in (\S{1,12}): (.+)|(\S{1,12}) 失败的测试：(.+))$/;
function heldOut(body) {
  const lines = (body || "").trim().split("\n");
  const prose = [], failures = [], names = new Map();
  let cur = null;
  lines.forEach((line, i) => {
    const afterBlank = i === 0 || lines[i - 1].trim() === "";
    const n = cur ? null : HELD_NAMES.exec(line);
    if (n && afterBlank) { names.set(n[1] ?? n[3], (n[2] ?? n[4]).split(/, |、/).map((s) => s.trim()).filter(Boolean)); return; }
    const m = HELD_HEAD.exec(line);
    if (m && afterBlank) { cur = { id: m[1], title: m[2], tail: "", names: names.get(m[1]) ?? [] }; failures.push(cur); }
    else if (cur) cur.tail += (cur.tail ? "\n" : "") + line;
    else prose.push(line);
  });
  for (const f of failures) f.tail = f.tail.trim();
  for (const [id, list] of names) if (!failures.some((f) => f.id === id)) failures.push({ id, title: "", tail: "", names: list });
  return { prose: prose.join("\n").trim(), failures };
}
const heldHtml = (h) => `<div class="heldout"><span class="label">${t("forYou")}</span>${h.failures.map((f) => `
  <div class="head"><span class="id">${esc(f.id)}</span><span>${esc(f.title)}</span></div>
  ${f.names.length ? `<div class="names"><span>${t("failing")}</span>${f.names.map((n) => `<code>${esc(n)}</code>`).join("")}</div>` : ""}
  ${f.tail ? `<pre class="tail">${esc(f.tail)}</pre>` : ""}`).join("")}</div>`;
// What the reply box asks for: a question wants an answer, a held-out card a hint, anything else a note.
const replyHtml = (i, held) => {
  const ph = held ? t("hintPlaceholder") : i.kind === "question" ? t("answerPlaceholder") : t("notePlaceholder");
  // The hint is a sentence or two, so its field opens two rows deep; a note or an answer starts at one.
  return `<div class="reply ${held ? "hint" : ""}"><textarea id="t-${esc(i.id)}" rows="${held ? 2 : 1}" placeholder="${esc(ph)}" aria-label="${esc(ph)}"></textarea><button class="btn ${held ? "primary" : ""}" data-send="${esc(i.id)}">${held ? t("sendHint") : t("send")}</button></div>`;
};
// Mirrors the supervisor's `answerable_away`: allowing a gated action, overriding a sentinel and
// installing changed dependencies with the network widen what the agent may do, so they are
// decided where the diff is — the page names them instead of offering them.
const DESK_ONLY = {
  approval: ["Allow", "Approve", "允许", "批准"],
  any: ["I've checked, go to review", "我已确认，进入评审", "I've checked, install with the network", "我看过改动，这次联网安装",
    "Show the agent the failure (it will see the held-out tests)", "把失败输出给 Agent 看（它会看到保留测试）"],
};
const atDeskOnly = (i, o) => (i.kind === "approval" ? DESK_ONLY.approval : DESK_ONLY.any).includes(o);
let armed = null;
// The card whose "later" choices are open (one at a time, like the arming).
let later = null;
async function snooze(id, until) {
  later = null;
  try { await api("/api/snooze", { inbox_id: id, until }); } catch (e) { alert(e.message); }
  load();
}
const tomorrowAt9 = () => { const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(9, 0, 0, 0); return d.getTime(); };
async function answer(id, response, danger) {
  if (danger && armed !== id + response) { armed = id + response; render(last); return; }
  armed = null;
  try { await api("/api/answer", { inbox_id: id, response }); } catch (e) { alert(e.message); }
  load();
}
async function pause(goal) {
  if (armed !== "pause" + goal) { armed = "pause" + goal; render(last); return; }
  armed = null;
  try { await api("/api/pause", { goal }); } catch (e) { alert(e.message); }
  load();
}
let last = null;
let lastOk = 0;
const ago = (at) => t("ago")(Math.round((Date.now() - at) / 60000));
// 24-hour "HH:MM" in both languages, as on the desk.
const clock = (at) => { const d = new Date(at); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
// Elapsed time in the desk's units ("42s", "3m", "1h 20m"), the same letters in both languages.
const dur = (ms) => { const s = Math.round(ms / 1000); if (s < 60) return `${s}s`; const m = Math.floor(s / 60); return m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${m % 60}m`; };
// "updated 03:05 · every 5 s"; once a minute has passed without a fresh read, the age is added and the line steps up a register.
function showStatus() {
  if (status.className === "off" || !lastOk) return;
  const stale = Date.now() - lastOk > 60_000;
  status.className = stale ? "stale" : "";
  statusText.textContent = `${t("updated")} ${clock(lastOk)} · ${stale ? ago(lastOk) : t("every")}`;
}
function render(s) {
  if (!s) return;
  lang = s.lang.startsWith("zh") ? "zh" : "en";
  document.documentElement.lang = s.lang;
  document.getElementById("foot").textContent = t("foot");
  const goals = new Map(s.goals.map((g) => [g.id, g]));
  const items = s.inbox.filter((i) => i.kind !== "review_ready");
  const ready = s.inbox.filter((i) => i.kind === "review_ready");
  let h = `<h2>${t("needs")}<span class="num">${items.length}</span></h2>`;
  if (!items.length) h += `<p class="empty">${G.ring}<span><b>${t("none")}</b><br>${t("noneBody")}</span></p>${ghost([[62, 40], [44, 58]])}`;
  for (const i of items) {
    const g = goals.get(i.goal_id);
    // Held-out tests failed: the output is for you alone, the hint is the way that keeps it so, and the agent-facing choices come after.
    const held = i.kind === "paused" && g && g.pause_reason === "held_out_failed" ? heldOut(i.body) : null;
    const p = held ? { prose: held.prose, tail: "" } : parts(i);
    const desk = [];
    const opts = i.options.map((o, n) => {
      if (atDeskOnly(i, o)) { desk.push(o); return ""; }
      const tone = i.tones[n] || (n === 0 ? "primary" : "neutral");
      const danger = tone === "destructive";
      const isArmed = danger && armed === i.id + o;
      return `<button class="btn ${tone === "primary" ? "primary" : ""} ${isArmed ? "armed" : ""}" data-id="${esc(i.id)}" data-o="${esc(o)}" data-d="${danger}">${esc(isArmed ? t("confirm") : o)}</button>`;
    }).join("");
    const security = i.kind === "paused" && g && g.pause_reason === "dependencies_changed";
    const laterOpen = later === i.id;
    h += `<article class="card">
      <div class="strip">${G.diamond}<span class="kind">${esc(t("kinds")[i.kind] ?? i.kind)}</span><span>·</span><span class="goal"><span class="mono">${esc(i.goal_id)}</span> ${esc(i.goal_title)}</span><span class="age num">${esc(ago(i.created_at))}</span><button class="bell" data-later="${esc(i.id)}" aria-label="${t("later")}" aria-expanded="${laterOpen}">${G.bell}</button></div>
      <div class="main">
        ${laterOpen ? `<div class="later"><span>${t("later")}</span><button class="btn" data-snooze="${esc(i.id)}" data-until="${Date.now() + 3_600_000}">${t("inHour")}</button><button class="btn" data-snooze="${esc(i.id)}" data-until="${tomorrowAt9()}">${t("tomorrow")}</button></div>` : ""}
        <p class="question ${i.kind === "ci_failed" ? "code" : ""}">${esc(i.subject)}</p>
        ${p.prose ? `<p class="body">${esc(p.prose)}</p>` : ""}
        ${p.tail ? `<pre class="tail">${esc(p.tail)}</pre>` : ""}
        ${held && held.failures.length ? heldHtml(held) : ""}
        ${held && i.allow_text ? replyHtml(i, true) : ""}
        ${security ? `<p class="caution">${G.notice}<span>${t("security")}</span></p>` : ""}
        ${opts ? `<div class="opts">${opts}</div>` : ""}
        ${desk.length ? `<p class="desk">${G.notice} ${t("atDesk")}: ${desk.map((o) => `<b>${esc(o)}</b>`).join(" · ")}</p>` : ""}
        ${held ? `<p class="caution note">${G.notice}<span>${t("heldOutNote")}</span></p>` : ""}
        ${!held && i.allow_text && i.kind !== "assumption" ? replyHtml(i, false) : ""}
      </div></article>`;
  }
  if (ready.length) {
    h += `<h2>${t("toAccept")}<span class="num">${ready.length}</span></h2>`;
    for (const i of ready) {
      const g = goals.get(i.goal_id);
      const seal = g && g.verified_pin ? `<span class="seal">${G.seal}<span class="pin">@${esc(g.verified_pin.slice(0, 7))}</span></span><span class="sep">·</span>` : "";
      // One column, one kind of thing: the id rides in the second line, the right column stays empty — it is the pause button's, on running rows.
      h += `<div class="row">${G.state("in_review")}<div><div class="title">${esc(i.goal_title)}</div><div class="live">${seal}<span class="id">${esc(i.goal_id)}</span><span class="sep">·</span><span class="detail">${esc(t("acceptOnDesk"))}</span></div></div><span></span></div>`;
    }
  }
  const running = s.goals.filter((g) => g.state === "running");
  h += `<h2>${t("running")}<span class="num">${running.length}</span></h2>`;
  if (!running.length) h += `<p class="empty">${G.ring}<span>${t("noRuns")}</span></p>${ghost([[54, 36]])}`;
  for (const g of running) {
    const l = g.live_line;
    const badge = t("modes")[g.mode] ?? g.mode;
    const detail = l ? `${l.action}${l.target ? " · " + l.target : ""}` : "";
    const elapsed = g.run_started_at ? `<span class="sep">·</span><span class="elapsed num">${esc(t("runningFor")(dur(Math.max(0, Date.now() - g.run_started_at))))}</span>` : "";
    const isArmed = armed === "pause" + g.id;
    h += `<div class="row">${G.state("running")}<div><div class="title">${esc(g.title)}</div><div class="live"><span class="badge">${esc(badge)}</span><span class="detail ${l && machine(l.target || "") ? "code" : ""}">${esc(detail)}</span>${elapsed}</div></div>
      <button class="btn ghost ${isArmed ? "armed" : ""}" data-pause="${esc(g.id)}">${esc(isArmed ? t("confirm") : t("pause"))}</button></div>`;
  }
  app.innerHTML = h;
  status.className = "";
  showStatus();
}
app.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.retry !== undefined) return load();
  if (b.dataset.later) { later = later === b.dataset.later ? null : b.dataset.later; return render(last); }
  if (b.dataset.snooze) return snooze(b.dataset.snooze, Number(b.dataset.until));
  if (b.dataset.pause) return pause(b.dataset.pause);
  if (b.dataset.send) { const v = document.getElementById("t-" + b.dataset.send).value.trim(); if (v) answer(b.dataset.send, v, false); return; }
  if (b.dataset.id) answer(b.dataset.id, b.dataset.o, b.dataset.d === "true");
});
async function load() {
  if (!token) { app.innerHTML = `<p class="empty">${G.ring}<span>${t("unpaired")}</span></p>`; document.getElementById("foot").textContent = t("foot"); return; }
  try { last = await api("/api/state"); lastOk = Date.now(); render(last); }
  catch (e) {
    // The sentence is the page's; the browser's own words stay in the tooltip, and the way back is one button.
    // It is said once, in the body; the status line keeps the one reading it still has — when the page last got through.
    app.innerHTML = `<p class="error" title="${esc(e.message)}"><span>${t("offline")}</span><button class="btn ghost" data-retry>${t("retry")}</button></p>`;
    status.className = "off"; statusText.textContent = lastOk ? `${t("updated")} ${clock(lastOk)}` : "";
  }
}
load();
setInterval(() => { if (!document.hidden && !document.activeElement?.matches("textarea")) load(); }, 5000);
setInterval(showStatus, 15000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
