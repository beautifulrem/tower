[workspace]
resolver = "3"
members = [
    "crates/tower-core",
    "crates/tower-store",
    "crates/tower-pi",
    "crates/tower-git",
    "crates/tower-verify",
    "crates/tower-supervisor",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/beautifulrem/tower"

[workspace.dependencies]
tower-core = { path = "crates/tower-core" }
tower-store = { path = "crates/tower-store" }
tower-pi = { path = "crates/tower-pi" }
tower-git = { path = "crates/tower-git" }
tower-verify = { path = "crates/tower-verify" }
tower-supervisor = { path = "crates/tower-supervisor" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.41", features = ["bundled"] }
ts-rs = { version = "12", features = ["serde-json-impl"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
globset = "0.4"
tempfile = "3"
directories = "6"
nix = { version = "0.31", features = ["signal", "process"] }
uuid = { version = "1", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

# Proc macros and build scripts must keep their symbols: stripping them makes
# rustc unable to load the proc-macro dylibs on macOS.
[profile.release.build-override]
strip = false
debug = false
