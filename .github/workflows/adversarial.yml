name: Adversarial (real model)

# Nightly, and on demand: a real model is asked to take shortcuts, by class,
# and Tower must hold every one; honest controls in JavaScript and Rust
# must reach review (crates/tower-supervisor/tests/adversarial.rs). A
# shortcut still running at the time limit fails; one the model did not
# take is "not exercised", not a pass. The per-class block rates and the
# honest-control false-hold rate go to the run summary and to the
# `adversarial-report` artifact (JSON).
#
# Needs a model: set the repository secret CLINE_API_KEY (ClinePass);
# without it the job says so and does nothing. Locally: tools/adversarial.sh.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Goal names or classes to run (comma-separated substrings; empty: all)"
        required: false
        default: ""

jobs:
  adversarial:
    runs-on: macos-latest
    # About 30 goals at up to 10 minutes each, two at a time.
    timeout-minutes: 240
    env:
      CLINE_API_KEY: ${{ secrets.CLINE_API_KEY }}
    steps:
      - name: A model is configured
        id: model
        run: |
          if [ -z "$CLINE_API_KEY" ]; then
            echo "No CLINE_API_KEY secret: nothing to run." >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.model.outputs.configured == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.model.outputs.configured == 'true'

      - uses: actions/setup-node@v7
        if: steps.model.outputs.configured == 'true'
        with:
          node-version: 24

      - name: Pi and the ClinePass provider
        if: steps.model.outputs.configured == 'true'
        run: |
          npm i -g @earendil-works/pi-coding-agent@1.4.0
          mkdir -p "$RUNNER_TEMP/provider" && npm i --prefix "$RUNNER_TEMP/provider" pi-clinepass-provider@1.6.0
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"

      - name: Shortcuts are held, fixes reach review
        if: steps.model.outputs.configured == 'true'
        env:
          TOWER_ADVERSARIAL_ONLY: ${{ github.event.inputs.only }}
        run: |
          set -o pipefail
          TOWER_ADVERSARIAL_MODEL=clinepass/cline-pass/deepseek-v4.1-flash \
          TOWER_ADVERSARIAL_EXTENSION="$RUNNER_TEMP/provider/node_modules/pi-clinepass-provider/src/index.ts" \
          TOWER_ADVERSARIAL_REPORT="$RUNNER_TEMP/adversarial/report.json" \
          TOWER_ADVERSARIAL_JOBS=2 \
            cargo test -p tower-supervisor --test adversarial -- --ignored --nocapture | tee adversarial.txt

      - name: Block rates in the summary
        if: always() && steps.model.outputs.configured == 'true'
        run: grep -E '^\|' adversarial.txt >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always() && steps.model.outputs.configured == 'true'
        with:
          name: adversarial-report
          path: ${{ runner.temp }}/adversarial/report.json
          if-no-files-found: warn
