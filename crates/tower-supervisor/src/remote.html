<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Tower</title>
<style>
  /*
   * Tower on a phone: Flight-Deck console in one calm column. Precision
   * surfaces in oklch, solid vs dashed provenance registers, live SSE event
   * stream with fallback polling, and 44pt iOS touch targets. Zero external
   * requests; every API & SSE request carries the 256-bit fragment token in
   * Authorization: Bearer only.
   */
  :root {
    --bg: oklch(0.992 0.002 80); --bg-raised: oklch(1 0 0); --bg-inset: oklch(0.975 0.003 80);
    --bg-strip: oklch(0.982 0.003 80); --bg-hover: oklch(0.955 0.004 80); --bg-selected: oklch(0.940 0.006 80);
    --border-subtle: oklch(0.20 0.01 70 / 0.08); --border: oklch(0.20 0.01 70 / 0.14); --border-strong: oklch(0.20 0.01 70 / 0.24);
    --text-1: oklch(0.220 0.006 70); --text-2: oklch(0.425 0.006 70); --text-3: oklch(0.530 0.006 70); --text-4: oklch(0.555 0.005 70);
    --st-attention: oklch(0.600 0.150 65); --attention-bg: oklch(0.962 0.034 85);
    --st-danger: oklch(0.540 0.190 25); --st-verified: oklch(0.550 0.130 155); --st-active: oklch(0.500 0.130 240);
    --verified-bg: oklch(0.960 0.025 155); --focus: oklch(0.220 0.006 70 / 0.65);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: oklch(0.168 0.005 70); --bg-raised: oklch(0.205 0.006 70); --bg-inset: oklch(0.148 0.004 70);
      --bg-strip: oklch(0.186 0.005 70); --bg-hover: oklch(0.232 0.006 70); --bg-selected: oklch(0.262 0.007 70);
      --border-subtle: oklch(1 0 0 / 0.07); --border: oklch(1 0 0 / 0.13); --border-strong: oklch(1 0 0 / 0.20);
      --text-1: oklch(0.945 0.003 70); --text-2: oklch(0.840 0.005 70); --text-3: oklch(0.700 0.006 70); --text-4: oklch(0.590 0.006 70);
      --st-attention: oklch(0.800 0.150 75); --attention-bg: oklch(0.228 0.032 75);
      --st-danger: oklch(0.750 0.150 25); --st-verified: oklch(0.770 0.130 155); --st-active: oklch(0.780 0.120 235);
      --verified-bg: oklch(0.215 0.028 155); --focus: oklch(0.945 0.003 70 / 0.70);
    }
  }
  * { box-sizing: border-box; }
  p, pre, figure { margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text-1);
    font: 15px/22px -apple-system, "PingFang SC", system-ui, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; letter-spacing: -0.003em;
    padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, "PingFang SC", monospace; font-size: 12.5px; }
  button { font: inherit; color: inherit; cursor: default; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, textarea:focus-visible { outline: 1.5px solid var(--focus); outline-offset: 2px; }

  /* Flight-Deck top telemetry strip. */
  header {

    padding-bottom: 10px; margin-bottom: 8px; border-bottom: 1px solid var(--border);

  .wordmark svg { display: block; }
  #status { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 4px 10px; min-width: 0; font-size: 12px; line-height: 16px; color: var(--text-2); white-space: nowrap; }
  #gauges { display: contents; }
  #conn:empty { display: none; }
  .gauge { display: inline-flex; align-items: center; gap: 5px; }
  .gauge svg { display: block; flex: 0 0 auto; }
  .gauge.active, .gauge.stale, .gauge.off { color: var(--text-1); }
  .gauge.live { color: var(--text-2); font-size: 11px; padding: 1px 6px; border: 1px solid var(--border-subtle); border-radius: 999px; background: var(--bg-strip); }
  .gauge.dead { color: var(--text-4); }
  .gauge .dot { width: 6px; height: 6px; border-radius: 1px; flex: 0 0 auto; background: var(--st-danger); }
  .gauge .dot.ok { border-radius: 50%; background: var(--st-verified); }
  .gauge .dot.hollow { background: transparent; border: 1px solid var(--st-danger); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  h2 { display: flex; align-items: center; gap: 10px; margin: 24px 0 8px; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-2); }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--border-subtle); }
  h2 .num { color: var(--text-3); order: 3; font-size: 12px; }
  .empty { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; color: var(--text-2); font-size: 14px; }
  .empty svg { flex: 0 0 auto; margin-top: 6px; color: var(--text-3); }
  .ghost { margin-top: 4px; pointer-events: none; }
  .ghost .row { min-height: 44px; background: transparent; border: 0; border-top: 1px solid var(--border-subtle); border-radius: 0; padding: 6px 0; }
  .ghost svg { color: var(--text-4); }
  .ghost .bar { display: block; height: 6px; border-radius: 3px; background: var(--bg-selected); }
  .ghost .bar + .bar { margin-top: 8px; }
  .offline { display: grid; gap: 4px; padding: 18px 0 0; }
  .error { display: flex; align-items: baseline; gap: 10px; color: var(--text-1); font-size: 16px; line-height: 24px; font-weight: 500; }
  .error::before { content: ""; display: inline-block; width: 8px; height: 8px; background: var(--st-danger); flex: 0 0 auto; transform: translateY(-1px); }
  .offline .sub { padding-left: 18px; color: var(--text-2); font-size: 14px; text-wrap: pretty; }
  .offline .when { padding-left: 18px; color: var(--text-3); font-size: 12px; }
  .offline .btn { margin-top: 14px; width: 100%; }

  /* Decision Gate Card: amber attention bar + structured provenance registers. */
  .card { border: 1px solid var(--border); border-radius: 8px; background: var(--bg-raised); margin-bottom: 12px; overflow: hidden; }
  /* The amber rule stands clear of the card's 8px corner, so it stays a straight 2px line instead of following the curve. */
  .strip { position: relative; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; background: var(--attention-bg); font-size: 12px; color: var(--text-2); white-space: nowrap; }
  .strip::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; background: var(--st-attention); }
  .strip .mark { width: 9px; height: 9px; flex: 0 0 auto; }
  .strip .kind { color: var(--text-1); font-weight: 600; }
  .strip .goal { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .strip .age { margin-left: auto; color: var(--text-3); flex: 0 0 auto; }
  .strip .bell { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin: 0 -14px 0 -4px; padding: 0; border: 0; background: transparent; color: var(--text-3); opacity: .75; flex: 0 0 auto; }
  .strip .bell[aria-expanded="true"], .strip .bell:active { opacity: 1; color: var(--text-1); }
  .later { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; align-items: center; font-size: 12px; color: var(--text-3); }
  .later > span { grid-column: 1 / -1; }
  .later .btn { min-height: 44px; padding: 0 10px; font-size: 14px; }
  .main { padding: 11px 12px 12px; display: grid; gap: 9px; }
  .question { font-size: 16px; line-height: 23px; font-weight: 500; letter-spacing: -0.008em; user-select: text; }
  .question.code, .tail { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .question.code { font-size: 14.5px; font-weight: 500; word-break: break-word; }
  .body { color: var(--text-2); font-size: 14px; white-space: pre-wrap; word-break: break-word; user-select: text; }
  /* Agent-reported blocker claim uses dashed left border (Claim register, never Fact green). */
  .claim-box { border-left: 2px dashed var(--border-strong); background: var(--bg-inset); padding: 8px 10px; border-radius: 0 6px 6px 0; display: grid; gap: 4px; }
  .claim-box .tag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-3); }
  .tail { margin: 0; padding: 8px 10px; border-radius: 6px; background: var(--bg-inset); border: 1px solid var(--border-subtle); font-size: 12px; line-height: 18px; color: var(--text-2); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 160px; overflow: auto; font-variant-ligatures: none; }
  .tail .tl { display: block; padding-left: 2ch; text-indent: -2ch; }
  .caution { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; line-height: 16px; color: var(--text-1); }
  .caution svg { flex: 0 0 auto; margin-top: 3px; }
  .caution.note { color: var(--text-3); }
  .heldout { display: grid; gap: 8px; padding: 2px 0 2px 10px; border-left: 2px solid var(--text-1); }
  .heldout .label { font-size: 12px; line-height: 16px; color: var(--text-2); font-weight: 500; }
  .heldout .head { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
  .heldout .head .id { color: var(--text-3); font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
  .heldout .names { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 12px; color: var(--text-3); }
  .heldout .names code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; line-height: 20px; padding: 0 6px; border: 1px solid var(--border); border-radius: 4px; color: var(--text-1); user-select: text; }
  .heldout .tail { margin: 0; }
  .opts { display: grid; grid-template-columns: repeat(var(--n, 1), minmax(0, 1fr)); gap: 8px; }
  .opts .btn { padding: 0 12px; }
  .opts .btn.primary { grid-column: 1 / -1; }
  .opts.stack { grid-template-columns: minmax(0, 1fr); }
  .opts.stack .btn { white-space: normal; line-height: 20px; padding: 11px 16px; }
  .btn { min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-raised); color: var(--text-1); font-size: 15px; font-weight: 500; white-space: nowrap; }
  .btn:active { background: var(--bg-selected); }
  .btn.primary { background: var(--text-1); border-color: var(--text-1); color: var(--bg); }
  .card.quiet:not(:focus-within) .btn.primary { background: var(--bg-raised); border-color: var(--border); color: var(--text-1); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
  .btn.armed { border-color: var(--st-danger); color: var(--st-danger); background: var(--bg-selected); }
  .btn:disabled { color: var(--text-3); border-color: var(--border-subtle); }
  .desk { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; line-height: 16px; color: var(--text-3); }
  .desk svg { flex: 0 0 auto; margin-top: 3px; }
  .desk b { font-weight: 500; color: var(--text-2); }
  textarea { width: 100%; font: inherit; font-size: 15px; line-height: 20px; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text-1); resize: none; min-height: 44px; outline: none; }
  textarea::placeholder { color: var(--text-3); }
  textarea:focus { border-color: var(--text-3); }
  textarea:focus-visible { outline: none; box-shadow: inset 0 0 0 1px var(--text-3); }
  .reply { display: flex; gap: 8px; align-items: flex-end; }
  .reply textarea { flex: 1; }
  .reply.hint { flex-wrap: wrap; }
  .reply.hint textarea { flex: 1 1 100%; }
  .reply.hint .btn { flex: 1 1 auto; }

  /* ATC Flight-Strip Goal Row: solid verified pips vs dashed observed pips + live telemetry. */
  .row {
    display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; column-gap: 10px; align-items: center;
    min-height: 58px; padding: 9px 10px; margin-bottom: 6px;
    border: 1px solid var(--border-subtle); border-radius: 7px; background: var(--bg-strip);
  }
  .row .glyph { display: block; }
  .row .head { display: flex; gap: 7px; align-items: baseline; min-width: 0; }
  .row .title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .row .meta { display: flex; gap: 6px; align-items: center; margin-top: 2px; min-width: 0; font-size: 12px; line-height: 16px; color: var(--text-2); }
  .row .meta .badge { color: var(--text-1); font-weight: 500; flex: 0 0 auto; }
  .row .meta .detail { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta .detail.code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; }
  .row .meta .id { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; color: var(--text-3); flex: 0 0 auto; }
  .row .meta .pill { font-size: 10.5px; padding: 0 5px; border: 1px solid var(--border-subtle); border-radius: 4px; color: var(--text-3); flex: 0 0 auto; }
  .pips { display: inline-flex; gap: 2px; align-items: center; flex: 0 0 auto; }
  .pip { width: 10px; height: 4px; border-radius: 1px; background: var(--border); }
  .pip.v { background: var(--st-verified); }
  .pip.o { background: transparent; border: 1px dashed var(--text-3); }
  .row .seal { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-1); font-weight: 500; flex: 0 0 auto; }
  .row .seal .pin { color: var(--text-2); font-weight: 400; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; }
  .row .btn { min-height: 44px; padding: 0 12px; font-size: 13.5px; }
  .row .head .elapsed { margin-left: auto; font-size: 11.5px; color: var(--text-3); flex: 0 0 auto; }
  .foot { margin-top: 26px; font-size: 11px; line-height: 16px; color: var(--text-4); text-align: center; text-wrap: balance; }
  .foot + .foot { margin-top: 4px; }
</style>
</head>
<body>
<header>
  <span class="wordmark" aria-hidden="true">
    <svg width="14" height="14" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="butt" stroke-linejoin="miter"><rect x="1.125" y="1.125" width="7.75" height="2.75"/><path d="M5 3.875 V9.5 M3 9.375 H7"/></svg>

  <span id="status"><span id="gauges"></span><span id="conn" class="gauge" role="status"></span></span>

<main id="app"></main>

<script>

        states: { draft: "草稿", ready: "就绪", running: "运行中", paused: "已暂停", claimed: "自称完成", verifying: "验证中", in_review: "待验收", accepted: "已验收", integrated: "已合入", archived: "已归档", abandoned: "已放弃" },
        modes: { idle: "空闲", starting: "准备中", thinking: "思考", reading: "执行", editing: "执行", executing: "执行", waiting_on_you: "等你", retrying: "重试", compacting: "压缩中", verifying: "验证", settled: "已停" },

};
const LANG_KEY = "tower-lang";
